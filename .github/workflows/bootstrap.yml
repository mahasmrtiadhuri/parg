name: Validate packaged workspace
on:
  push:
    paths: [parg-source.tar.gz, .github/workflows/bootstrap.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: parg
          POSTGRES_PASSWORD: ci-disposable-password
          POSTGRES_DB: parg_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U parg -d parg_test" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PARG_TEST_DATABASE_URL: postgres://parg:ci-disposable-password@localhost:5432/parg_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: tar -xzf parg-source.tar.gz
      - run: cargo fmt --all
      - run: cargo generate-lockfile
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-workspace
          path: |
            Cargo.lock
            crates/
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets
      - run: python3 scripts/setup.py
      - run: docker compose up --build -d ledger policy
      - run: docker compose run --rm demo
      - if: always()
        run: docker compose down -v
